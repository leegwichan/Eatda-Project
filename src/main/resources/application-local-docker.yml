spring:
  config:
    import: optional:secret-local-docker.yml

  datasource:
    url: jdbc:h2:mem:eatda;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  cloud:
    aws:
      region:
        static: ap-northeast-2
      s3:
        bucket: eatda-storage-local

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

  sql:
    init:
      data-locations: classpath:db/init.sql
      mode: always

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_batch_fetch_size: 30

  flyway:
    enabled: false

logging:
  config: classpath:logback-local-docker.xml

jwt:
  access-token-expiration: 1h
  refresh-token-expiration: 1d
  secret-key: ${JWT_SECRET_KEY}

cors:
  origin:
    - "http://localhost:3000"

oauth:
  client-id: ${OAUTH_CLIENT_ID:unused-in-dev-mode}
  redirect-path: /login/callback
  allowed-origins:
    - "http://localhost:3000"

local-docker:
  enabled: ${LOCAL_DOCKER_ENABLED:true}

kakao:
  api-key: ${KAKAO_API_KEY:unused-in-dev-mode}

s3:
  presigned-base-url: ${S3_PRESIGNED_BASE_URL:}

cdn:
  base-url: "http://localhost:4566"
