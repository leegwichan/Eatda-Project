services:
  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=ap-northeast-2
    volumes:
      - ./localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh
    healthcheck:
      test: ["CMD", "awslocal", "s3", "ls"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ../server
      dockerfile: ../docker/Dockerfile.server
    ports:
      - "8080:8080"
    environment:
      # Spring profile
      SPRING_PROFILES_ACTIVE: local-docker

      # Secrets (from .env)
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      KAKAO_API_KEY: ${KAKAO_API_KEY}

      # LocalStack S3 override
      SPRING_CLOUD_AWS_S3_ENDPOINT: http://localstack:4566
      SPRING_CLOUD_AWS_S3_PATH_STYLE_ACCESS_ENABLED: "true"
      SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY: test
      SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY: test

      # Seed data location (mounted volume)
      SPRING_SQL_INIT_DATA_LOCATIONS: file:/app/seed/init.sql

      # CDN points to LocalStack S3 for image serving
      CDN_BASE_URL: "localhost:4566/eatda-storage-local"
    volumes:
      - ./seed/init.sql:/app/seed/init.sql:ro
    depends_on:
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  web:
    build:
      context: ../web
      dockerfile: ../docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    environment:
      # SSR API calls use Docker internal DNS
      INTERNAL_API_URL: http://server:8080
      SESSION_PASSWORD: ${SESSION_PASSWORD}
      ORIGIN_VERIFY: ${ORIGIN_VERIFY}
      HOSTNAME: 0.0.0.0
    depends_on:
      server:
        condition: service_healthy
