services:
  localstack:
    image: keochan/eatda-localstack:latest
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=ap-northeast-2
    healthcheck:
      test: ["CMD", "awslocal", "s3", "ls"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  server:
    image: keochan/eatda-server:latest
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local-docker
      JWT_SECRET_KEY: local-dev-jwt-secret-key-min-32-chars-eatda
      DEV_LOGIN_ENABLED: "true"
      SPRING_CLOUD_AWS_S3_ENDPOINT: http://localstack:4566
      SPRING_CLOUD_AWS_S3_PATH_STYLE_ACCESS_ENABLED: "true"
      SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY: test
      SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY: test
      SPRING_SQL_INIT_DATA_LOCATIONS: file:/app/seed/init.sql
      CDN_BASE_URL: "http://localstack:4566/eatda-storage-local"
    depends_on:
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  web:
    image: keochan/eatda-web:latest
    ports:
      - "3000:3000"
    environment:
      INTERNAL_API_URL: http://server:8080
      SESSION_PASSWORD: local-dev-session-password-32chars-eatda
      ORIGIN_VERIFY: local-dev-origin-verify-token-eatda
      HOSTNAME: 0.0.0.0
    depends_on:
      server:
        condition: service_healthy
